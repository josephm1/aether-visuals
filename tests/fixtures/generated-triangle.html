<div class="wrap"><h2>Triangle area</h2><p>Drag any vertex. The dashed line shows the perpendicular height.</p><svg id="s" viewBox="0 0 640 420" style="width:100%;max-height:55vh;touch-action:none" aria-label="Interactive triangle with draggable vertices"><line id="ext" stroke="#8993a7" stroke-dasharray="4 5"/><polygon id="tri" fill="#6b8cff33" stroke="#6489ff" stroke-width="3"/><line id="alt" stroke="#ffbe55" stroke-width="3" stroke-dasharray="7 5"/><path id="right" fill="none" stroke="#ffbe55" stroke-width="2"/><text id="bl" text-anchor="middle" fill="currentColor"/><text id="hl" fill="#ffbe55"/><g id="handles"></g></svg><div class="formula">Area = ½ × base × height</div><div id="values" aria-live="polite"></div><p class="note">Height is measured at a right angle to the base—even when it falls outside the triangle. Distances use the grid scale: 40 pixels = 1 unit.</p><button id="reset">Reset</button></div><style>body{margin:0;font:16px system-ui;color:#e7ebf5;background:#111827}.wrap{max-width:720px;margin:auto;padding:20px}h2{margin:0 0 8px}p{color:#b9c3d6;line-height:1.45}.formula{font-size:22px;font-weight:700;margin:12px 0}#values{font-size:19px;color:#a9c0ff;line-height:1.6}.note{font-size:14px}button{background:#283a63;color:white;border:1px solid #526da0;border-radius:8px;padding:9px 18px}svg text{font:16px system-ui;paint-order:stroke;stroke:#111827;stroke-width:5px;stroke-linejoin:round}circle{cursor:grab}circle:active{cursor:grabbing}</style><script>const s=document.getElementById('s'),ns='http://www.w3.org/2000/svg';let p=[{x:120,y:325},{x:510,y:325},{x:310,y:80}],drag=null;const el=id=>document.getElementById(id);p.forEach((v,i)=>{const c=document.createElementNS(ns,'circle');c.setAttribute('r',12);c.setAttribute('fill',i===2?'#ffbe55':'#93b0ff');c.setAttribute('stroke','#111827');c.setAttribute('stroke-width',3);c.setAttribute('tabindex',0);c.setAttribute('role','slider');c.setAttribute('aria-label','Vertex '+['A','B','C'][i]+'. Use arrow keys to move.');c.addEventListener('pointerdown',e=>{drag=i;s.setPointerCapture(e.pointerId);e.preventDefault()});c.addEventListener('keydown',e=>{const d={ArrowLeft:[-5,0],ArrowRight:[5,0],ArrowUp:[0,-5],ArrowDown:[0,5]}[e.key];if(d){e.preventDefault();p[i].x=Math.max(25,Math.min(615,p[i].x+d[0]));p[i].y=Math.max(25,Math.min(370,p[i].y+d[1]));draw()}});el('handles').appendChild(c)});function line(id,a,b){let n=el(id);n.setAttribute('x1',a.x);n.setAttribute('y1',a.y);n.setAttribute('x2',b.x);n.setAttribute('y2',b.y)}function draw(){let[a,b,c]=p,dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy),ux=L?dx/L:1,uy=L?dy/L:0,t=(c.x-a.x)*ux+(c.y-a.y)*uy,f={x:a.x+t*ux,y:a.y+t*uy},H=Math.hypot(c.x-f.x,c.y-f.y);el('tri').setAttribute('points',p.map(v=>v.x+','+v.y).join(' '));line('alt',c,f);line('ext',{x:a.x+Math.min(0,t)*ux,y:a.y+Math.min(0,t)*uy},{x:a.x+Math.max(L,t)*ux,y:a.y+Math.max(L,t)*uy});let vx=H?(c.x-f.x)/H:-uy,vy=H?(c.y-f.y)/H:ux;el('right').setAttribute('d',`M ${f.x+ux*12} ${f.y+uy*12} l ${vx*12} ${vy*12} l ${-ux*12} ${-uy*12}`);let bl=el('bl');bl.setAttribute('x',(a.x+b.x)/2-uy*25);bl.setAttribute('y',(a.y+b.y)/2+ux*25);bl.textContent='base = '+(L/40).toFixed(2);let hl=el('hl');hl.setAttribute('x',(c.x+f.x)/2+14);hl.setAttribute('y',(c.y+f.y)/2);hl.textContent='height = '+(H/40).toFixed(2);[...el('handles').children].forEach((n,i)=>{n.setAttribute('cx',p[i].x);n.setAttribute('cy',p[i].y)});el('values').textContent=`½ × ${(L/40).toFixed(2)} × ${(H/40).toFixed(2)} = ${(L*H/3200).toFixed(2)} square units`;if(!L)el('values').textContent='Base = 0; area = 0. Move A or B apart to define a height.'}s.addEventListener('pointermove',e=>{if(drag===null)return;let q=s.createSVGPoint();q.x=e.clientX;q.y=e.clientY;q=q.matrixTransform(s.getScreenCTM().inverse());p[drag]={x:Math.max(25,Math.min(615,q.x)),y:Math.max(25,Math.min(370,q.y))};draw()});s.addEventListener('pointerup',()=>drag=null);s.addEventListener('pointercancel',()=>drag=null);el('reset').onclick=()=>{p=[{x:120,y:325},{x:510,y:325},{x:310,y:80}];draw()};draw();</script>
